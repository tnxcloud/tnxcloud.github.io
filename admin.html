<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — TNxMovieZone</title>
<meta name="robots" content="noindex, nofollow">
<link rel="stylesheet" href="css/style.css?v=5">
<link rel="icon" href="logo/logo.png" type="image/png">
</head>
<body>

<!-- ============ LOGIN VIEW (div-based, NO form element) ============ -->
<div id="loginView" class="admin-login-wrap">
  <div class="login-card">
    <h1><span class="grad">TNxMovieZone</span> Admin</h1>
    <p>Sign in with a GitHub personal access token to manage your catalog.</p>
    <div class="login-err" id="loginError"></div>
    <div id="loginForm">
      <div class="field">
        <label for="ghToken">GitHub Token</label>
        <input type="password" id="ghToken" placeholder="Paste your token here" autocomplete="off" autocapitalize="off" spellcheck="false">
      </div>
      <div class="field">
        <label for="ghOwner">Owner</label>
        <input type="text" id="ghOwner" value="tnxmoviezone" autocomplete="off" spellcheck="false">
      </div>
      <div class="field">
        <label for="ghRepo">Repository</label>
        <input type="text" id="ghRepo" value="tnxmoviezone.github.io" autocomplete="off" spellcheck="false">
      </div>
      <div class="field">
        <label for="ghBranch">Branch</label>
        <input type="text" id="ghBranch" value="main" autocomplete="off" spellcheck="false">
      </div>
      <button type="button" class="btn btn-grad" id="loginBtn" style="width:100%" onclick="doAdminLogin()">Connect</button>
    </div>
    <p style="margin-top:18px;font-size:.78rem;color:var(--text-faint);">Token is never stored on any server — it stays in this browser only.</p>
  </div>
</div>

<!-- ============ DASHBOARD VIEW ============ -->
<div id="dashView" style="display:none;">
  <header class="header">
    <div class="wrap header-inner">
      <a href="index.html" class="logo">TNxMovieZone <span style="font-size:.7rem;color:var(--text-faint)">ADMIN</span></a>
      <div style="margin-left:auto;display:flex;gap:10px;">
        <button class="btn btn-ghost btn-sm" type="button" onclick="window.open('index.html','_blank')">View Site</button>
      </div>
    </div>
  </header>

  <main class="wrap">
    <div class="dash-head">
      <h1 style="font-size:1.6rem;font-weight:800;">Dashboard</h1>
      <button class="btn btn-grad" type="button" onclick="openMovieModal()">+ Add Movie</button>
    </div>

    <div class="stats">
      <div class="stat"><div class="n" id="stTotal">0</div><div class="l">Total Movies</div></div>
      <div class="stat"><div class="n" id="stFeatured">0</div><div class="l">Featured</div></div>
      <div class="stat"><div class="n" id="stTrending">0</div><div class="l">Trending</div></div>
      <div class="stat"><div class="n" id="stHidden">0</div><div class="l">Unlisted</div></div>
    </div>

    <div class="tabs">
      <button class="tab-btn on" type="button" data-tab="movies" onclick="switchTab('movies')">🎬 Movies</button>
      <button class="tab-btn" type="button" data-tab="settings" onclick="switchTab('settings')">⚙️ Site Settings</button>
      <button class="tab-btn" type="button" data-tab="cats" onclick="switchTab('cats')">🏷️ Categories</button>
      <button class="tab-btn" type="button" data-tab="ads" onclick="switchTab('ads')">📢 Ads</button>
    </div>

    <!-- Movies tab -->
    <div class="tab-pane on" id="tab-movies">
      <div class="field" style="max-width:340px;">
        <input type="text" id="movieSearch" placeholder="🔍 Filter movies..." oninput="filterMovieTable()">
      </div>
      <div class="tbl-wrap">
        <table>
          <thead>
            <tr><th>Poster</th><th>Title</th><th>Year</th><th>Genre</th><th>Flags</th><th>Status</th><th>Actions</th></tr>
          </thead>
          <tbody id="moviesTbody">
            <tr><td colspan="7" style="text-align:center;color:var(--text-faint)">Loading...</td></tr>
          </tbody>
        </table>
      </div>
    </div>

    <!-- Settings tab -->
    <div class="tab-pane" id="tab-settings">
      <div class="tbl-wrap" style="padding:24px;">
        <div class="field"><label>Site Name</label><input type="text" id="setSiteName"></div>
        <div class="field"><label>Logo URL (optional)</label><input type="text" id="setLogo"></div>
        <div class="field"><label>📤 Upload Logo from Device</label><input type="file" id="logoFile" accept="image/*" style="padding:10px;"><div id="logoUploadStatus" style="font-size:12px;color:#888;margin-top:6px;"></div></div>
        <div class="field"><button class="btn" type="button" onclick="removeLogo()" style="background:rgba(239,68,68,.12);color:#f66;border:1px solid rgba(239,68,68,.3);">🗑 Remove Logo</button></div>
        <div class="field"><label>Embed Server Template (use {tmdb} placeholder)</label><input type="text" id="setEmbed" placeholder="https://example.com/embed/movie/{tmdb}"></div>
        <div class="field"><label>TMDB API Key (for auto-fill — get free at themoviedb.org)</label><input type="text" id="setTmdbKey" placeholder="Paste your TMDB API key" autocomplete="off" spellcheck="false"></div>
        <div class="field"><label>Announcement / Notice (optional)</label><input type="text" id="setNotice"></div>
        <div class="check-row"><input type="checkbox" id="setDarkDefault" checked> <label for="setDarkDefault" style="margin:0">Dark theme by default</label></div>
        <div style="margin-top:20px;display:flex;gap:12px;flex-wrap:wrap;"><button class="btn btn-grad" type="button" onclick="saveSettings()">Save Settings</button><button class="btn btn-danger" type="button" onclick="doLogout()">Disconnect</button></div>
      </div>
    </div>

    <!-- Categories tab -->
    <div class="tab-pane" id="tab-cats">
      <div class="tbl-wrap" style="padding:24px;">
        <div class="field"><label>Categories (one per line)</label><textarea id="setCats" rows="8"></textarea></div>
        <div><button class="btn btn-grad" type="button" onclick="saveCategories()">Save Categories</button></div>
      </div>
    </div>

    <!-- Ads tab -->
    <div class="tab-pane" id="tab-ads">
      <div class="tbl-wrap" style="padding:24px;">
        <div class="check-row" style="margin-bottom:16px;"><input type="checkbox" id="adsHeadEnabled"> <label for="adsHeadEnabled" style="margin:0">Enable Head Code</label></div>
        <div class="field"><label>Head Code (paste ad script for &lt;head&gt;)</label><textarea id="adsHead" rows="5" placeholder="<script>...</script>" spellcheck="false"></textarea></div>
        <div class="check-row" style="margin-bottom:16px;"><input type="checkbox" id="adsBodyEnabled"> <label for="adsBodyEnabled" style="margin:0">Enable Body Code</label></div>
        <div class="field"><label>Body Code (banner / popup ad code)</label><textarea id="adsBody" rows="5" placeholder="<script>...</script>" spellcheck="false"></textarea></div>
        <div><button class="btn btn-grad" type="button" onclick="saveAds()">Save Ads</button></div>
      </div>
    </div>
  </main>
</div>

<!-- ============ MOVIE MODAL ============ -->
<div class="modal-bg" id="movieModal">
  <div class="modal" style="position:relative;">
    <button type="button" class="modal-back" onclick="closeMovieModal()" aria-label="Back">← Back</button>
    <h2 id="modalTitle">Add Movie</h2>
    <input type="hidden" id="mId">
    <div class="field" id="tmdbSearchWrap" style="margin-bottom:16px;">
      <label>🔍 TMDB Search (auto-fill)</label>
      <input type="text" id="tmdbSearch" placeholder="Type movie name…" autocomplete="off" spellcheck="false">
      <div id="tmdbResults" style="display:none;max-height:220px;overflow-y:auto;margin-top:8px;border:1px solid rgba(139,92,246,.25);border-radius:12px;"></div>
    </div>
    <div class="grid2" style="display:grid;grid-template-columns:1fr 1fr;gap:14px;">
      <div class="field"><label>Title *</label><input type="text" id="mTitle"></div>
      <div class="field"><label>Year</label><input type="text" id="mYear"></div>
      <div class="field" style="grid-column:1/-1;"><label>🎬 Content Type</label><div id="typeSelect" class="cat-select"></div></div>
      <div class="field"><label>Release Date</label><input type="date" id="mReleaseDate"></div>
      <div class="field"><label>Genre</label><input type="text" id="mGenre"></div>
      <div class="field"><label>📂 Category <small style="color:var(--text-faint)">(TMDB theke auto-select hobe)</small></label><div id="catSelect" class="cat-select"></div><div style="display:flex;gap:8px;margin-top:8px;"><select id="catDropdown" style="flex:1;"><option value="">— Category select koro —</option></select><input type="text" id="newCatInput" placeholder="Notun category..." style="flex:1;"><button type="button" class="btn btn-ghost btn-sm" id="addCatBtn">+ Add</button></div></div>
      <div class="field"><label>Language</label><input type="text" id="mLang" placeholder="English, Hindi, Bengali…"></div>
      <div class="field"><label>Country</label><input type="text" id="mCountry" placeholder="USA, India, Bangladesh…"></div>
      <div class="field"><label>TMDB ID</label><input type="text" id="mTmdb"></div>
      <div class="field"><label>Rating (e.g. 8.2)</label><input type="text" id="mRating"></div>
      <div class="field"><label>Duration</label><input type="text" id="mDuration" placeholder="2h 15m"></div>
      <div class="field"><label>Director</label><input type="text" id="mDirector"></div>
      <div class="field"><label>Cast (comma separated)</label><input type="text" id="mCast"></div>
    </div>
    <div class="field"><label>Poster URL</label><input type="text" id="mPoster"></div>
    <div class="field"><label>📤 Upload Poster from Device (4K supported)</label><input type="file" id="mPosterFile" accept="image/*" style="padding:10px;"><div id="posterUploadStatus" style="font-size:12px;color:#888;margin-top:4px;"></div></div>
    <div class="field"><label>Backdrop URL</label><input type="text" id="mBackdrop"></div>
    <div class="field"><label>📤 Upload Backdrop from Device (4K supported)</label><input type="file" id="mBackdropFile" accept="image/*" style="padding:10px;"><div id="backdropUploadStatus" style="font-size:12px;color:#888;margin-top:4px;"></div></div>
    <div class="field">
      <label>🎬 Video Servers <small style="color:var(--text-faint)">(embed / iframe supported)</small></label>
      <div id="serverList"></div>
      <button type="button" class="btn btn-ghost btn-sm" id="addServerBtn" style="margin-top:8px;">+ Add Server</button>
    </div>
    <div class="field"><label>Description</label><textarea id="mDesc" rows="4"></textarea></div>
    <div class="field"><label>Search Keywords / Tags <small style="color:var(--text-faint)">(comma separated — improves search)</small></label><input type="text" id="mTags" placeholder="action thriller, rajinikanth, jailer..."></div>
    <div class="field"><label>🎬 Trailer URL <small style="color:var(--text-faint)">(YouTube)</small></label><input type="text" id="mTrailer" placeholder="https://youtube.com/watch?v=..."></div>
    <div class="field"><label>🏷️ Quality</label><select id="mQuality"><option value="">— Select —</option><option>HD</option><option>FHD</option><option>4K</option><option>CAM</option><option>HDTS</option><option>HDTC</option><option>DVD</option><option>WEB-DL</option><option>BluRay</option></select></div>
    <div class="field"><label>📺 Episodes <small style="color:var(--text-faint)">(thakle Web Series-e show hobe)</small></label><input type="text" id="mEpisodes" placeholder="e.g. 12 ba S1: 8, S2: 10"></div>
    <div style="display:flex;gap:18px;flex-wrap:wrap;margin-top:6px;">
      <label class="toggle-row"><input type="checkbox" id="mFeatured" class="toggle-input"><span class="toggle-sw"></span> Featured</label>
      <label class="toggle-row"><input type="checkbox" id="mTrending" class="toggle-input"><span class="toggle-sw"></span> Trending</label>
      <label class="toggle-row"><input type="checkbox" id="mListed" class="toggle-input" checked><span class="toggle-sw"></span> Listed <small style="color:var(--text-faint)">(visible on site)</small></label>
    </div>
    <div class="modal-actions">
      <button class="btn btn-ghost" type="button" onclick="closeMovieModal()">Cancel</button>
      <button class="btn btn-danger" type="button" id="mDeleteBtn" style="display:none" onclick="deleteMovie()">Delete</button>
      <button class="btn btn-grad" type="button" onclick="saveMovie()">Save Movie</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="js/admin.js?v=4"></script>
</body>
</html>
