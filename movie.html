<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Movie — TNxMovieZone</title>
<link rel="stylesheet" href="css/style.css?v=3">
<link rel="icon" href="logo/logo.png" type="image/png">
</head>
<body>

<header class="header">
  <div class="wrap header-inner">
    <a href="index.html" class="logo" id="siteLogo">TNxMovieZone</a>
    <nav class="nav">
      <a href="index.html">Home</a>
      <a href="index.html#trending">Trending</a>
    </nav>
    <div class="header-search">
      <span class="icon">🔍</span>
      <input type="text" id="searchInput" placeholder="Search movies..." autocomplete="off">
      <div class="search-results" id="searchResults"></div>
    </div>
    <button class="icon-btn" id="themeToggle" title="Toggle theme">🌙</button>
  </div>
</header>

<main class="wrap">
  <section class="detail-hero" id="detailHero">
    <div class="hero-bg"><img id="dBackdrop" src="" alt=""></div>
    <div class="hero-shade"></div>
    <a class="btn btn-ghost btn-sm back-overlay" href="index.html">← Back</a>
  </section>

  <section class="detail-body">
    <div class="detail-top-row">
      <div class="detail-poster-col">
        <div class="detail-poster"><img id="dPoster" src="" alt="Poster"></div>
        <a class="btn btn-grad btn-watch-side" id="dWatch" href="#">▶ Watch Now</a>
      </div>
      <div class="detail-side-extra"><div class="detail-extra" id="dExtra"></div></div>
    </div>
    <div class="detail-info">
      <h1 class="detail-title" id="dTitle">Loading...</h1>
      <div class="detail-meta" id="dMeta"></div>
      <p class="detail-desc" id="dDesc"></p>
      <div id="dCastSec" style="display:none;margin-top:20px;">
        <h3 class="row-title" style="font-size:1.05rem;">🎭 Cast</h3>
        <div class="cast-grid" id="dCast"></div>
      </div>
      <div class="hero-actions">
      </div>
    </div>
  </section>

  <section class="row-sec">
    <div class="row-head"><h2 class="row-title">You May Also Like</h2></div>
    <div class="poster-row" id="relatedRow"></div>
  </section>
</main>

<footer class="footer">
  <div class="wrap footer-inner">
    <span>© <span id="year"></span> <span id="footName">TNxMovieZone</span>. All rights reserved.</span>
    <span>Made for movie lovers 🍿</span>
  </div>
</footer>

<script src="js/movie.js?v=1"></script>
</body>
</html>
