<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VioletFlex — Watch Movies & Shows</title>
<meta name="description" content="VioletFlex — stream movies and shows in HD.">
<link rel="stylesheet" href="css/style.css?v=1">
<link rel="icon" href="logo/logo.png" type="image/png">
</head>
<body>

<header class="header">
  <div class="wrap header-inner">
    <a href="index.html" class="logo" id="siteLogo">VioletFlex</a>
    <nav class="nav">
      <a href="index.html" class="active">Home</a>
      <a href="index.html#trending">Trending</a>
      <a href="index.html#latest">Latest</a>
    </nav>
    <div class="header-search">
      <span class="icon">🔍</span>
      <input type="text" id="searchInput" placeholder="Search movies..." autocomplete="off">
      <div class="search-results" id="searchResults"></div>
    </div>
    <button class="icon-btn" id="themeToggle" title="Toggle theme">🌙</button>
  </div>
</header>

<div class="wrap"><div id="noticeBar" class="notice-bar" style="display:none;">📢 <span id="noticeText"></span></div></div>

<main class="wrap">
  <!-- Hero billboard -->
  <section class="hero" id="hero">
    <div class="hero-bg"><img id="heroBg" src="" alt=""></div>
    <div class="hero-shade"></div>
    <div class="hero-content">
      <span class="hero-badge" id="heroBadge">✨ Featured</span>
      <h1 class="hero-title" id="heroTitle">Loading...</h1>
      <div class="hero-meta" id="heroMeta"></div>
      <p class="hero-desc" id="heroDesc"></p>
      <div class="hero-actions">
        <a class="btn btn-grad" id="heroWatch" href="#">▶ Watch Now</a>
        <a class="btn btn-ghost" id="heroInfo" href="#">More Info</a>
      </div>
    </div>
    <div class="hero-dots" id="heroDots"></div>
  </section>

  <!-- Category filter chips -->
  <div class="chips" id="catChips"></div>

  <!-- Trending row -->
  <section class="row-sec" id="trending">
    <div class="row-head">
      <h2 class="row-title">Trending Now</h2>
    </div>
    <div class="poster-row" id="trendingRow"></div>
  </section>

  <!-- Latest row -->
  <section class="row-sec" id="latest">
    <div class="row-head">
      <h2 class="row-title">Latest Added</h2>
    </div>
    <div class="poster-row" id="latestRow"></div>
  </section>

  <!-- Category rows injected here -->
  <div id="catRows"></div>
</main>

<footer class="footer">
  <div class="wrap footer-inner">
    <span>© <span id="year"></span> <span id="footName">VioletFlex</span>. All rights reserved.</span>
    <span>Made for movie lovers 🍿</span>
  </div>
</footer>

<script src="js/app.js?v=1"></script>
</body>
</html>
